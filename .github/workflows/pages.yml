# dsh-go 文档站：Hugo 构建 + GitHub Pages 部署
#
# 触发：推送到 master（含 site/ 变更）时构建并发布文档站
# 产物：https://JopenChen.github.io/dsh-go/
name: Deploy dsh-go Docs

on:
  push:
    branches: [master]
    paths: ["site/**", ".github/workflows/pages.yml", ".gitmodules"]
  workflow_dispatch:

# 权限：允许写入 Pages 并部署
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只跑一个部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 拉取 submodule（Hextra 主题）
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.165.0"
          extended: true

      - name: Build
        working-directory: site
        run: hugo --minify --baseURL https://JopenChen.github.io/dsh-go/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://JopenChen.github.io/dsh-go/
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

# Dsh-Go 文档站 Hugo 配置（Hextra 主题）
# 构建产物发布到 GitHub Pages: https://JopenChen.github.io/dsh-go/

# ============================================================================
# 站点基础
# ============================================================================
baseURL: https://JopenChen.github.io/dsh-go/
title: "Dsh-Go"
theme: hextra
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
enableRobotsTXT: true
enableGitInfo: true
canonifyURLs: true

# ============================================================================
# 多语言（含每语言顶部导航菜单）
# ============================================================================
languages:
  en:
    label: English
    weight: 1
    title: "Dsh-Go — In-process Go reference implementation of the DeepSeek Harness Agent"
    params:
      description: "An in-process Go reference implementation of the DeepSeek Harness Agent — learn how an Agent kernel really works."
    menus:
      main:
        - name: "Docs"
          pageRef: "/en/docs"
          weight: 1
        - name: "Tutorials"
          pageRef: "/en/tutorials"
          weight: 2
        - name: "FAQ"
          pageRef: "/en/faq"
          weight: 3
        - name: "Examples"
          pageRef: "/en/examples"
          weight: 4
        - name: "GitHub"
          url: "https://github.com/JopenChen/dsh-go"
          weight: 5
  zh-cn:
    label: 简体中文
    weight: 2
    title: "Dsh-Go — DeepSeek Harness Agent 的 Go 参考实现"
    params:
      description: "进程内 Go 参考实现 — 读懂 Agent 内核"
    menus:
      main:
        - name: "文档"
          pageRef: "/zh-cn/docs"
          weight: 1
        - name: "教程"
          pageRef: "/zh-cn/tutorials"
          weight: 2
        - name: "FAQ"
          pageRef: "/zh-cn/faq"
          weight: 3
        - name: "示例"
          pageRef: "/zh-cn/examples"
          weight: 4
        - name: "GitHub"
          url: "https://github.com/JopenChen/dsh-go"
          weight: 5

# ============================================================================
# 内容
# ============================================================================
# 目录结构即侧边导航（leaf bundle 组织）
disableKinds:
  - taxonomy
  - term
  - rss

# ============================================================================
# 参数（Hextra 特有）
# ============================================================================
params:
  # 主题外观（默认暗色，DeepSeek Harness 玻璃拟态风格）
  theme:
    default: dark
    displayToggle: true

  # 搜索（Hextra 内置全文搜索）
  search:
    enable: true
    type: flexsearch

  # 页脚
  footer:
    displayPoweredBy: false
    displayCopyright: true
    copyright: "© 2026 Dsh-Go — DeepSeek Harness Agent 的 Go 参考实现"

  # 编辑链接（跳到 GitHub 源文件）
  editURL:
    enable: true
    base: "https://github.com/JopenChen/dsh-go/edit/master/site/content"

  # 代码高亮
  highlight:
    default: true

# ============================================================================
# 代码高亮（Go 语法等）
# ============================================================================
markup:
  highlight:
    noClasses: false
    lineNos: true
    lineNumbersInTable: false
  goldmark:
    renderer:
      unsafe: true # 允许内容里写原生 HTML（如示例表格）
